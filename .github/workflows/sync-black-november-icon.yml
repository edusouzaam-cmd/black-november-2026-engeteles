name: Export current Black November icon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-black-november-icon.yml"

permissions:
  contents: read

jobs:
  export-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload current icon
        uses: actions/upload-artifact@v4
        with:
          name: current-black-november-icon
          path: public/assets/black-november/black-november-icon.png
          if-no-files-found: error
